<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Campus Event Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard.index') }}">Campus Event Manager</a>
    <nav>
      <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a href="{{ url_for('events.index') }}">Events</a>
      <a href="{{ url_for('users.index') }}">Users</a>
      <a href="{{ url_for('analytics.index') }}">Analytics</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
